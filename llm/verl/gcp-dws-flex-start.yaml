name: verl-gcp-dws-flex-start

config:
  gcp:
    managed_instance_group:
      run_duration: 604800
      provision_timeout: 604800

resources:
  infra: gcp
  instance_type: a3-highgpu-8g
  disk_size: 1000
  image_id: docker:verlai/verl:app-verl0.6-transformers4.56.1-sglang0.5.2-mcore0.13.0-te2.2

run: |
  nvidia-smi --query-gpu=name,memory.total --format=csv,noheader
  python -c 'import importlib.metadata as m; print("verl", m.version("verl"))'
